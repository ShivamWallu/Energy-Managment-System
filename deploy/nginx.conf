# ==============================================================================
# EMS Intelligence — Production Nginx Configuration
# Reverse Proxy, SSL Termination, Asset Caching, and Security Headers
# ==============================================================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=ems_api_limit:10m rate=30r/s;

upstream uvicorn_backend {
    server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ems.yourdomain.com; # Replace with your production domain or EC2 Public IP

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ems.yourdomain.com; # Replace with your production domain

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ems.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ems.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Max upload file size for SCADA Excel files (50MB)
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2 image/svg+xml;

    # Static Assets Direct Serving & Browser Caching
    location /css/ {
        alias /var/www/ems/frontend/css/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        alias /var/www/ems/frontend/js/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /Images/ {
        alias /var/www/ems/Images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /images/ {
        alias /var/www/ems/Images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Endpoints (with rate-limiting)
    location /api/ {
        limit_req zone=ems_api_limit burst=20 nodelay;
        proxy_pass http://uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Frontend Single Page Application fallback
    location / {
        proxy_pass http://uvicorn_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logging
    access_log /var/log/nginx/ems_access.log;
    error_log /var/log/nginx/ems_error.log warn;
}
